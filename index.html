<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <title>Rishi's OS</title>
    <style>
        body {
            background-image: url('bg.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            position: fixed;
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }
        .full-page {
            width: 100%;
            height: 100%;
            background-color: black;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center; 
            align-items: center; 
            animation: fadeout 5s ease-in-out forwards;    
            z-index: 99999; 
            pointer-events: none;
        }
        @keyframes fadeout {
            0% { visibility: visible; opacity: 1; }
            70% { opacity: 1; }
            99% { visibility: visible; opacity: 0; }
            100% { visibility: hidden; opacity: 0; }
        }
        .full-page h1 {
            color: white;
            font-weight: 800;
            font-size: 80px;
            margin: 0;               
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px #00d2ff;
        }
        .desktop {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-gap: 20px;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            align-content: start;
        }
        .desktop button, .appIcon {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 8px;
            color: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease-in-out;
            font-family: inherit;
        }
        .desktop button:hover, .appIcon:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }
        .desktop button img, .appIcon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
            margin-bottom: 6px;
        }
        .desktop button span, .appIcon span {
            font-size: 10px;
            text-align: center;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Window Container and OS Window Styles */
        #window-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .os-window {
            position: absolute;
            width: 450px;
            height: 550px;
            background: rgba(20, 24, 33, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
        }
        .os-window.minimized {
            display: none !important;
        }
        .os-window.maximized {
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border-radius: 0;
        }
        .titlebar {
            height: 38px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            color: white;
            font-weight: 600;
            cursor: move;
            user-select: none;
        }
        .win-btns {
            display: flex;
            gap: 6px;
        }
        .win-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: background 0.2s;
        }
        .win-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .win-btn.close:hover {
            background: #ff4757;
        }
        .os-window iframe {
            width: 100%;
            height: calc(100% - 38px);
            border: none;
            background: white;
        }
    </style>
</head>
<body>
    <div class="full-page">
        <h1>Rishi OS<br>Loading....</h1>
    </div>

    <div class="desktop">
        <button class="appIcon" onclick="openApp('Calculator', 'src/calculater.html')">
            <img src="Images/calculater.png" alt="Calculator" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1011/1011863.png'">
            <span>Rishi Calculator</span>
        </button>
        <button class="appIcon" id="stopwatch-icon" title="Stopwatch" onclick="openApp('Stopwatch', 'src/stopwatch.html')">
            <img src="Images/stopwatch.png" alt="Stopwatch" onerror="this.src='https://cdn-icons-png.flaticon.com/512/865/865969.png'">
            <span>Rishi Stopwatch</span>
        </button>
        <button class="appIcon" id="calendar-icon" title="Calendar" onclick="openApp('Calendar', 'src/calendar.html')">
            <img src="Images/calendar.png" alt="Calendar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2693/2693507.png'">
            <span>Rishi Calendar</span>
        </button>
    </div>

    <div id="window-container"></div>

    <script>
        let highestZIndex = 100;
        const windowStates = {};
        let windowCascadeOffset = 0;

        function getAppId(appName) {
            return 'win-' + appName.replace(/\s+/g, '-').toLowerCase();
        }

        function openApp(appName, appUrl) {
            const windowId = getAppId(appName);
            let win = document.getElementById(windowId);
            
            if (win) {
                if (win.classList.contains('minimized')) {
                    win.classList.remove('minimized');
                }
                bringToFront(windowId);
                return;
            }
            
            const container = document.getElementById('window-container');
            win = document.createElement('div');
            win.className = 'os-window';
            win.id = windowId;

            const initialTop = 80 + (windowCascadeOffset * 30);
            const initialLeft = 80 + (windowCascadeOffset * 30);
            windowCascadeOffset = (windowCascadeOffset + 1) % 8;

            win.style.top = initialTop + 'px';
            win.style.left = initialLeft + 'px';

            win.innerHTML = `
                <div class="titlebar" onmousedown="bringToFront('${windowId}')">
                    <span>Rishi ${appName}</span>
                    <div class="win-btns">
                        <button class="win-btn" title="Minimize" onclick="minimizeApp('${windowId}')">—</button>
                        <button class="win-btn" title="Maximize" onclick="maximizeApp('${windowId}')">□</button>
                        <button class="win-btn close" title="Close" onclick="closeApp('${windowId}')">✕</button>
                    </div>
                </div>
                <iframe src="${appUrl}" title="${appName}"></iframe>
            `;

            win.addEventListener('mousedown', () => bringToFront(windowId));
            container.appendChild(win);

            windowStates[windowId] = {
                isMaximized: false,
                top: win.style.top,
                left: win.style.left,
                width: '450px',
                height: '550px'
            };

            makeDraggable(win);
            bringToFront(windowId);
        }

        function bringToFront(windowId) {
            const win = document.getElementById(windowId);
            if (!win) return;

            highestZIndex++;
            win.style.zIndex = highestZIndex;

            document.querySelectorAll('.os-window').forEach(w => w.classList.remove('active-window'));
            win.classList.add('active-window');
        }

        function closeApp(windowId) {
            const win = document.getElementById(windowId);
            if (win) {
                win.remove();
                delete windowStates[windowId];
            }
        }

        function maximizeApp(windowId) {
            const win = document.getElementById(windowId);
            const state = windowStates[windowId];
            if (!win || !state) return;

            if (!state.isMaximized) {
                state.top = win.style.top;
                state.left = win.style.left;
                state.width = win.style.width;
                state.height = win.style.height;

                win.classList.add('maximized');
                state.isMaximized = true;
            } else {
                win.classList.remove('maximized');
                win.style.top = state.top;
                win.style.left = state.left;
                win.style.width = state.width;
                win.style.height = state.height;
                state.isMaximized = false;
            }
        }

        function minimizeApp(windowId) {
            const win = document.getElementById(windowId);
            if (win) {
                win.classList.add('minimized');
            }
        }

        function makeDraggable(win) {
            const titlebar = win.querySelector('.titlebar');
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            titlebar.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON' || win.classList.contains('maximized')) return;
                
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = win.offsetLeft;
                initialTop = win.offsetTop;

                document.querySelectorAll('iframe').forEach(iframe => iframe.style.pointerEvents = 'none');

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            function onMouseMove(e) {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                win.style.left = `${initialLeft + dx}px`;
                win.style.top = `${initialTop + dy}px`;
            }

            function onMouseUp() {
                isDragging = false;
                document.querySelectorAll('iframe').forEach(iframe => iframe.style.pointerEvents = 'auto');
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }
    </script>
</body>
</html>
